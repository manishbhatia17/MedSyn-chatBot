<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Customer Chat Inquiry</title>
</head>
<body>

    <p>Hello,</p>

    <p>A new customer inquiry was submitted through the MedGyn chatbot.</p>

    <br />

    <p>
        <u>Customer Information</u>
    </p>

    <p><strong>Name:</strong> @CustomerName</p>

    <p><strong>Email:</strong> @CustomerEmail</p>

    <p><strong>Phone:</strong> @CustomerPhone</p>

    <p><strong>State:</strong> @State</p>

    <p><strong>Country:</strong> @Country</p>

    <br />

    <p>
        <u>Customer Message</u>
    </p>

    <p>@CustomerMessage</p>

    <br />

    <p>Thank you.</p>

    <p>
        <img src="cid:companyLogo" style="height: 55px;" />
    </p>

</body>
</html>
